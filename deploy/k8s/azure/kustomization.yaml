apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-notes
# stage_bundle in deploy/common.sh copies namespace.yaml, postgres.yaml and app.yaml
# next to this file. Kustomize refuses to read them from the parent directory.
resources:
  - namespace.yaml
  - postgres.yaml
  - app.yaml
patches:
  - path: storage.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: postgres
  - path: service.yaml
    target:
      version: v1
      kind: Service
      name: ai-notes
# stage_bundle in deploy/common.sh rewrites namespace, newName and newTag in a copy.
images:
  - name: ai-notes
    newName: ai-notes
    newTag: latest
