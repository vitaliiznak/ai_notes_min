apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-notes
resources:
  - namespace.yaml
  - postgres.yaml
  - app.yaml
  - ingress.yaml
# stage_bundle in deploy/common.sh fills namespace, newName and newTag in a copy.
# Applying this file unchanged points the Deployment at a placeholder registry path.
images:
  - name: ai-notes
    newName: REGION-docker.pkg.dev/PROJECT_ID/ai-notes/ai-notes
    newTag: latest
