apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-notes
  labels:
    app.kubernetes.io/name: ai-notes
    app.kubernetes.io/component: api
data:
  AI_PROVIDER: openai
  OPENAI_MODEL: gpt-6-luna
  PORT: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-notes
  labels:
    app.kubernetes.io/name: ai-notes
    app.kubernetes.io/component: api
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "ai-notes"}'
spec:
  selector:
    app.kubernetes.io/name: ai-notes
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-notes
  labels:
    app.kubernetes.io/name: ai-notes
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-notes
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-notes
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 80
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: postgres:17-alpine
          command: ["sh", "-c", "until pg_isready -d \"$DATABASE_URL\"; do sleep 2; done"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-notes
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://notes:$(POSTGRES_PASSWORD)@postgres:5432/notes
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: ai-notes
          image: ai-notes
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-notes
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://notes:$(POSTGRES_PASSWORD)@postgres:5432/notes
            - name: AI_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: ai-notes
                  key: AI_PROVIDER
            - name: OPENAI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: ai-notes
                  key: OPENAI_MODEL
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: ai-notes
                  key: PORT
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-notes
                  key: OPENAI_API_KEY
                  optional: true
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
